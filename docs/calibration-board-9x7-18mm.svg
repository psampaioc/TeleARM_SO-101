<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <title>SO-101 webcam calibration checkerboard: 9 by 7 inner corners, 18 mm squares</title>
  <defs>
    <pattern id="checker" x="15" y="76.5" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" fill="white"/>
      <rect x="0" y="0" width="18" height="18" fill="black"/>
      <rect x="18" y="18" width="18" height="18" fill="black"/>
    </pattern>
  </defs>
  <rect width="210" height="297" fill="white"/>
  <rect x="15" y="76.5" width="180" height="144" fill="url(#checker)"/>
  <circle cx="9" cy="70.5" r="1.5" fill="black"/>
  <g font-family="sans-serif" font-size="4" fill="black">
    <text x="15" y="232">9 x 7 internal corners | 10 x 8 squares | nominal 18 mm</text>
    <text x="15" y="239">Print A4 at 100% / actual size. Do not fit to page.</text>
    <text x="15" y="246">Mount flat. Measure several printed squares with a ruler.</text>
  </g>
  <path d="M15 257v4m0-2h90m0-2v4" stroke="black" stroke-width="0.3" fill="none"/>
  <text x="15" y="267" font-family="sans-serif" font-size="4">This reference line measures 90 mm at 100%.</text>
</svg>
